name: Public CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  portable-tests:
    name: Python 3.12 / ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    env:
      PYTHONPATH: src
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]

    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Set up Python 3.12
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements-ci.txt

      - name: Install portable test dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements-ci.txt

      - name: Compile public source and portable tests
        run: python -m compileall -q src tests/test_panel_fixed_effects.py tests/test_stress_arithmetic.py tests/test_temporal_integrity.py

      - name: Import package
        run: python -c "import treasuryshield; print(treasuryshield.__version__)"

      - name: Run portable unit tests
        run: python -m pytest -q tests/test_panel_fixed_effects.py tests/test_stress_arithmetic.py tests/test_temporal_integrity.py
