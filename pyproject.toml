[build-system]
requires = ["setuptools>=77", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "treasuryshield-mrm"
version = "0.1.0"
description = "Public-data bank liquidity stress research and independent validation"
requires-python = ">=3.12"
dependencies = [
  "numpy>=2.0",
  "pandas>=2.2",
  "tabulate>=0.9",
  "pyarrow>=19",
  "polars>=1.0",
  "duckdb>=1.3",
  "pyreadstat>=1.2",
  "openpyxl>=3.1",
  "scipy>=1.15",
  "scikit-learn>=1.6",
  "quantile-forest>=1.4.2",
  "statsmodels>=0.14",
  "xgboost>=3.3",
  "lightgbm>=4.6",
  "hmmlearn>=0.3",
  "optuna>=4.0",
  "matplotlib>=3.10",
  "plotly>=6.0",
  "pydantic>=2.0",
  "requests>=2.32",
  "beautifulsoup4>=4.12",
  "psutil>=7.0"
]

[project.optional-dependencies]
test = ["pytest>=8.0"]
bayes = ["pymc>=5.0"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
